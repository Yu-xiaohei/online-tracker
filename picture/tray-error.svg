<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 托盘图标 - 异常状态：橙色简约雷达 + 泛光 + 警示 -->
  <defs>
    <filter id="glowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glowOrange)" fill="none" stroke="#FF6B00" stroke-width="1.8">
    <circle cx="16" cy="16" r="11"/>
    <circle cx="16" cy="16" r="7" opacity="0.7"/>
    <circle cx="16" cy="16" r="3" opacity="0.45"/>
  </g>
  <!-- 扫描线断开（异常感） -->
  <line x1="16" y1="16" x2="22" y2="10" stroke="#FF6B00" stroke-width="1.8"
        stroke-linecap="round" stroke-dasharray="3 2" filter="url(#glowOrange)"/>
  <circle cx="16" cy="16" r="2" fill="#FF6B00" filter="url(#glowOrange)"/>
  <!-- 右下角警示点 -->
  <circle cx="25" cy="25" r="4.5" fill="#EF4444" stroke="#fff" stroke-width="1.2" filter="url(#glowOrange)"/>
  <text x="25" y="28.5" text-anchor="middle" font-size="7"
        font-weight="bold" fill="#fff" font-family="sans-serif">!</text>
</svg>
