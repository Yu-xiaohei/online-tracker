<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 软件主图标：线条简约雷达 + 规范橙背景 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FF6B00"/>
  <!-- 雷达同心圆（白色线条） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.95">
    <circle cx="32" cy="32" r="20"/>
    <circle cx="32" cy="32" r="13" opacity="0.7"/>
    <circle cx="32" cy="32" r="6" opacity="0.45"/>
  </g>
  <!-- 雷达扫描线 -->
  <line x1="32" y1="32" x2="46" y2="18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 中心点 -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF"/>
  <!-- 目标光点 -->
  <circle cx="42" cy="38" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="42" cy="38" r="4.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
</svg>
